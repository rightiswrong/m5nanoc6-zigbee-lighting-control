name: Release

# Publishes a GitHub release when either
#   * main receives a commit whose manifest.json "version" has no v<version> tag
#     yet (bump the version, push, done — Actions creates the tag), or
#   * someone pushes a tag like v1.1.0 directly.
# Every release carries firmware for each supported board x radio stack
# (NanoC6: Zigbee + Matter; NanoH2: Zigbee - too little RAM for Arduino Matter):
#   spooky-<board>-<stack>-<tag>-factory.bin   whole-flash image, write at 0x0 (first install /
#                                              switching Zigbee ⇄ Matter; erases pairing!)
#   spooky-<board>-<stack>-<tag>-app.bin       app only, write at 0x10000 (updates keep pairing)
#   spooky-<board>-<stack>-<tag>-bootloader.bin / -partitions.bin / .elf
#     nanoc6-zigbee, nanoc6-matter (Thread), nanoc6-matter-wifi, nanoh2-zigbee
#   spooky_lights-<tag>.zip        the Home Assistant integration
#   nanoc6_spooky.mjs              optional Zigbee2MQTT converter
#   matter_label.py + friends      printable Matter pairing labels (tools-<tag>.zip)
#   SHA256SUMS.txt
# Run it manually (workflow_dispatch) to get the files as build artifacts
# without publishing a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: nothing by default, each job asks for what it needs. Only
# `publish` can write (create the release) and sign provenance attestations.
permissions: {}

env:
  ESP32_CORE: "3.3.12"   # pinned; bump deliberately (CI builds and tests it first)
  SKETCH: firmware/SpookyLights

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide tag and whether to publish
        id: decide
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/spooky_lights/manifest.json'))['version'])")
          fw=$(sed -n 's/^#define FW_VERSION *"\(.*\)"/\1/p' "$SKETCH/config.h")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; publish=true
          else
            tag="v$manifest"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              publish=false   # this version is already released
            else
              publish=$([[ "$GITHUB_REF" == refs/heads/main ]] && echo true || echo false)
            fi
          fi
          echo "tag=$tag manifest=$manifest firmware=$fw publish=$publish"
          test "${tag#v}" = "$manifest" || { echo "::error::tag $tag != manifest $manifest"; exit 1; }
          test "${tag#v}" = "$fw" || { echo "::error::tag $tag != firmware FW_VERSION $fw"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: git init -q "$RUNNER_TEMP/jsQR" && git -C "$RUNNER_TEMP/jsQR" fetch -q --depth 1 https://github.com/cozmo/jsQR 8e6a036beafa7053dd44b1b76ac578d22b1b3311 && git -C "$RUNNER_TEMP/jsQR" checkout -q FETCH_HEAD
      - name: Firmware host tests (all variants)
        run: tools/hosttest/run.sh
        env:
          JSQR: ${{ runner.temp }}/jsQR/dist/jsQR.js
      - name: Integration logic tests
        run: python3 -m unittest discover -s tests

  firmware:
    needs: [plan, tests]
    name: Build ${{ matrix.board }}-${{ matrix.stack }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { board: nanoc6, chip: esp32c6, stack: zigbee, fqbn: "esp32:esp32:esp32c6:CDCOnBoot=cdc,PartitionScheme=zigbee_zczr,ZigbeeMode=zczr" }
          - { board: nanoc6, chip: esp32c6, stack: matter, fqbn: "esp32:esp32:esp32c6:CDCOnBoot=cdc,PartitionScheme=huge_app" }
          - { board: nanoc6, chip: esp32c6, stack: matter-wifi, fqbn: "esp32:esp32:esp32c6:CDCOnBoot=cdc,PartitionScheme=huge_app", defines: "-DMATTER_USE_WIFI=1" }
          - { board: nanoh2, chip: esp32h2, stack: zigbee, fqbn: "esp32:esp32:esp32h2:CDCOnBoot=cdc,PartitionScheme=zigbee_zczr,ZigbeeMode=zczr" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - name: Install the Espressif ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$ESP32_CORE"
          arduino-cli core list | tee "core-version.txt"
      - name: Compile
        run: |
          extra=()
          if [ -n "${{ matrix.defines }}" ]; then extra=(--build-property "compiler.cpp.extra_flags=${{ matrix.defines }}"); fi
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" "${extra[@]}" --build-path build --warnings default "$SKETCH"
      - name: Package
        run: |
          set -euo pipefail
          n="spooky-${{ matrix.board }}-${{ matrix.stack }}-${{ needs.plan.outputs.tag }}"
          b=build/SpookyLights.ino
          mkdir -p dist
          cp "$b.bin"            "dist/$n-app.bin"
          cp "$b.bootloader.bin" "dist/$n-bootloader.bin"
          cp "$b.partitions.bin" "dist/$n-partitions.bin"
          cp "$b.elf"            "dist/$n.elf"
          if [ -f "$b.merged.bin" ]; then
            cp "$b.merged.bin" "dist/$n-factory.bin"
          else
            # esptool from the pinned core, not an unpinned pip download
            esptool=$(find ~/.arduino15/packages/esp32/tools/esptool_py -type f -name esptool | head -n1)
            test -x "$esptool" || { echo "::error::esptool not found in the core"; exit 1; }
            boot_app0=$(find ~/.arduino15/packages/esp32/hardware -name boot_app0.bin | head -n1)
            "$esptool" --chip ${{ matrix.chip }} merge-bin -o "dist/$n-factory.bin" \
              0x0 "$b.bootloader.bin" 0x8000 "$b.partitions.bin" 0xe000 "$boot_app0" 0x10000 "$b.bin"
          fi
          cp core-version.txt "dist/$n-core.txt"
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fw-${{ matrix.board }}-${{ matrix.stack }}
          path: dist/

  publish:
    needs: [plan, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign build-provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: fw
          merge-multiple: true
      - name: Package integration and tools
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.tag }}"
          mkdir -p dist
          mv fw/*.bin fw/*.elf dist/
          core=$(cat fw/*-core.txt | sort -u)
          (cd custom_components/spooky_lights && zip -qr "../../dist/spooky_lights-$v.zip" . -x '__pycache__/*')
          (cd tools && zip -qr "../dist/tools-$v.zip" matter_label.py matter_codes.py vendor -x '__pycache__/*' -x '*/__pycache__/*')
          cp zigbee2mqtt/nanoc6_spooky.mjs dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          {
            echo "## Which file do I flash?"
            echo
            echo "| Board | Pairs with | First install / switching stacks (write at 0x0) | Update, keeps pairing (write at 0x10000) |"
            echo "|---|---|---|---|"
            echo "| M5NanoC6 | ZHA / Zigbee2MQTT (Zigbee) | \`spooky-nanoc6-zigbee-$v-factory.bin\` | \`spooky-nanoc6-zigbee-$v-app.bin\` |"
            echo "| M5NanoC6 | Matter over Thread (QR code) | \`spooky-nanoc6-matter-$v-factory.bin\` | \`spooky-nanoc6-matter-$v-app.bin\` |"
            echo "| M5NanoC6 | Matter over Wi-Fi (QR code, no Thread border router needed) | \`spooky-nanoc6-matter-wifi-$v-factory.bin\` | \`spooky-nanoc6-matter-wifi-$v-app.bin\` |"
            echo "| M5NanoH2 | ZHA / Zigbee2MQTT (Zigbee) | \`spooky-nanoh2-zigbee-$v-factory.bin\` | \`spooky-nanoh2-zigbee-$v-app.bin\` |"
            echo
            echo "The NanoH2 is Zigbee-only: Arduino's Matter library leaves it too little RAM to start Matter."
            echo "Use the NanoC6 for Matter."
            echo
            echo "Easiest: open https://web.esphome.io in Chrome/Edge, connect the board over USB-C, choose **Install**"
            echo "and pick the \`-factory.bin\`. A factory image erases the whole flash, including the Zigbee network"
            echo "or Matter pairing — that's what you want the first time, and when switching between Zigbee and Matter."
            echo
            echo "Matter builds print a pairing QR code on the serial monitor (115200 baud). Scan it in the Home"
            echo "Assistant app: **Settings → Devices → Add device → Add Matter device**. Needs a Thread border"
            echo "router (or use the Matter-over-Wi-Fi build, which needs only 2.4 GHz Wi-Fi) — see [docs/MATTER.md](https://github.com/${{ github.repository }}/blob/$v/docs/MATTER.md)."
            echo
            echo "## Verify a download"
            echo
            echo "Every file carries a signed build-provenance attestation, which proves it was built by this"
            echo "repository's release workflow from commit \`${{ github.sha }}\`. With the GitHub CLI:"
            echo
            echo '```'
            echo "gh attestation verify spooky-nanoc6-matter-$v-factory.bin --repo ${{ github.repository }}"
            echo '```'
            echo
            echo "## Build"
            echo
            echo '```'
            echo "$core"
            echo '```'
          } > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spooky-lights-${{ needs.plan.outputs.tag }}
          path: dist/
      - name: Attest build provenance (verify with `gh attestation verify <file> --repo <owner/repo>`)
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Spooky Lights ${{ needs.plan.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
