name: Hardened build

# Proves the hardened ESP-IDF project (hardened/, docs/HARDENING.md) still
# builds for every board, with every security option in effect, and that the
# provisioning eFuse sequence and the update path are valid. It signs with a
# THROWAWAY key, so the images are never published and must never be flashed.
# The provisioning dry run uses espefuse's virtual eFuses: no hardware.

on:
  push:
    paths: ["hardened/**", "firmware/**", ".github/workflows/hardened.yml"]
  pull_request:
    paths: ["hardened/**", "firmware/**", ".github/workflows/hardened.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Hardened ${{ matrix.board }}-${{ matrix.stack }} (throwaway key)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: nanoc6, stack: zigbee }
          - { board: nanoc6, stack: matter }
          - { board: nanoc6, stack: matter-wifi }
          - { board: nanoh2, stack: zigbee }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build (Secure Boot V2 + Flash Encryption + NVS encryption)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          set -o pipefail
          if ! SPOOKY_THROWAWAY_KEY=1 hardened/build.sh ${{ matrix.board }} ${{ matrix.stack }} 2>&1 | tee build.log; then
            # Surface the end of the log as an annotation (readable from the API / PR view).
            { grep -E -m 12 -A3 '(error|Error|FAILED|undefined reference|build.sh:)' build.log; echo '----- tail -----'; tail -n 12 build.log; } > summary.txt || true
            msg=$(cut -c1-300 summary.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=hardened build failed::${msg}"
            exit 1
          fi
      - name: Provisioning dry run on virtual eFuses (with and without a backup key)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          export SPOOKY_KEYS="$RUNNER_TEMP/keys" SPOOKY_YES=1
          mkdir -p "$SPOOKY_KEYS"
          espsecure.py generate_signing_key --version 2 --scheme ecdsa256 "$SPOOKY_KEYS/secure_boot_signing_key.pem"
          hardened/provision.sh --virt ${{ matrix.board }}-${{ matrix.stack }} ci-board -
          espsecure.py generate_signing_key --version 2 --scheme ecdsa256 "$SPOOKY_KEYS/secure_boot_signing_key_backup.pem"
          hardened/provision.sh --virt ${{ matrix.board }}-${{ matrix.stack }} ci-board-2 -
      - name: Update dry run (host-side encryption)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          espsecure.py generate_flash_encryption_key "$RUNNER_TEMP/fe.bin"
          SPOOKY_FE_KEY="$RUNNER_TEMP/fe.bin" hardened/update.sh --dry-run ${{ matrix.board }}-${{ matrix.stack }} ci-board -
      - name: Keep the resolved configuration for review
        if: always()
        run: |
          mkdir -p review
          cp hardened/build/${{ matrix.board }}-${{ matrix.stack }}.config/sdkconfig review/ 2>/dev/null || true
          cp hardened/out/${{ matrix.board }}-${{ matrix.stack }}/flash.txt review/ 2>/dev/null || true
          cp hardened/matter/dependencies.lock review/matter-dependencies.lock 2>/dev/null || true
          cp hardened/zigbee/dependencies.lock review/zigbee-dependencies.lock 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hardened-${{ matrix.board }}-${{ matrix.stack }}-config
          path: review/
